name: Update AGENTS.md
on:
  schedule:
    - cron: "0 0 */2 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  update:
    uses: sheepbox8646/agents-md-updater/.github/workflows/update-agents-md.yml@main
    with:
      agent: claude
      target_files: AGENTS.md
      extra_instructions: |
        Preserve the contribution templates, automated label policy, screenshot evidence requirements,
        and human QA disclosure rules in AGENTS.md. Do not weaken these repository policies.
      pr_body: |
        ## 提交者身份
        - [x] Agent
        - [ ] Human

        ## 变更类型
        - [ ] bug
        - [x] feat
        - [ ] test

        ## 变更说明
        根据当前仓库结构更新 AGENTS.md 中的开发指引。

        ## 验证方式与结果
        工作流已完成文档更新；尚未运行产品行为验证，请审查文档与代码的一致性。

        ## 截图 / 录屏
        仅修改开发文档，没有可见产品界面变化。以文档差异审查作为验证。

        ## 人工 QA 状态
        - [x] 尚未人工验证
        - [ ] 已获人工确认

        ⚠️ **No human QA** — this PR has not been verified by a human yet. Remove this line once a human confirms the happy path.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN	: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
