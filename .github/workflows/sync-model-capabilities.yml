name: Sync model capabilities

# Refreshes the reasoning capabilities (thinking_mode + reasoning_efforts) in the
# first-party conf/providers templates from the LiteLLM registry. This runs at
# build time only; the server never fetches LiteLLM at runtime. The resulting PR
# diff is plain YAML, so it is reviewed like any other template change.
on:
  schedule:
    # Weekly, Mondays 04:00 UTC.
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Enrich provider templates from LiteLLM
        run: go run ./cmd/synccaps

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/sync-model-capabilities
          base: main
          title: "chore: sync model reasoning capabilities from LiteLLM"
          body: |
            ## 提交者身份
            - [x] Agent
            - [ ] Human

            ## 变更类型
            - [ ] bug
            - [x] feat
            - [ ] test

            ## 变更说明
            自动刷新供应商模板中的 thinking_mode 和 reasoning_efforts，并移除第三方转售条目。

            ## 验证方式与结果
            已运行 go run ./cmd/synccaps 完成生成；尚未验证真实供应商调用。

            ## 截图 / 录屏
            仅更新供应商能力配置，没有可见界面变化。以生成差异和 CI 结果作为验证。

            ## 人工 QA 状态
            - [x] 尚未人工验证
            - [ ] 已获人工确认

            ⚠️ **No human QA** — this PR has not been verified by a human yet. Remove this line once a human confirms the happy path.
          commit-message: "chore: sync model reasoning capabilities from LiteLLM"
          add-paths: conf/providers/*.yaml
          delete-branch: true
