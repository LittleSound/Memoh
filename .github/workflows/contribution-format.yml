name: Contribution format gate
on:
  workflow_call:
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    name: Contribution format
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # This is ordinary read-only PR CI, so validate the rules in the merge commit.
      # Privileged labeling/approval remains in the default-branch controller.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const { gate } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/contribution-governance.mjs`);
            await gate({ github, context, core });
