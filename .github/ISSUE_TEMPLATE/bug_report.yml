---
name: Bug Report
description: 报告错误或与预期不符的行为
title: "[Bug]: "
labels:
- bug
body:
- type: dropdown
  id: author
  attributes:
    label: 提交者身份
    description: 请声明这份提交由人类还是 Agent 编写。
    options:
    - Human
    - Agent
  validations:
    required: true
- type: dropdown
  id: type
  attributes:
    label: 变更类型
    options:
    - bug
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: 问题描述
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: 复现步骤
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: 预期与实际行为
  validations:
    required: true
- type: textarea
  id: version
  attributes:
    label: 版本
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: 运行环境
  validations:
    required: false
- type: textarea
  id: model
  attributes:
    label: 使用的模型
  validations:
    required: false
- type: textarea
  id: logs
  attributes:
    label: 日志
    description: 如有相关错误，请粘贴日志并移除令牌等敏感信息。
  validations:
    required: false
- type: textarea
  id: screenshots
  attributes:
    label: 截图 / 录屏
    description: 推荐拖入或粘贴实际截图。Agent 应附图；无法截图或不适用时，请具体说明原因和替代验证。
  validations:
    required: false
- type: textarea
  id: additional
  attributes:
    label: 补充说明
  validations:
    required: false
