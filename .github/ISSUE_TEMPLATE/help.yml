---
name: Help
description: 寻求安装、配置或使用帮助
title: "[Help]: "
labels:
- help
body:
- type: dropdown
  id: author
  attributes:
    label: 提交者身份
    description: 请声明这份提交由人类还是 Agent 编写。
    options:
    - Human
    - Agent
  validations:
    required: true
- type: dropdown
  id: type
  attributes:
    label: 变更类型
    options:
    - help
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: 遇到的问题
  validations:
    required: true
- type: textarea
  id: goal
  attributes:
    label: 希望达到的目标
  validations:
    required: true
- type: textarea
  id: attempts
  attributes:
    label: 已经尝试的方法
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: 版本与运行环境
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: 日志
    description: 如有相关错误，请粘贴日志并移除令牌等敏感信息。
  validations:
    required: false
- type: textarea
  id: screenshots
  attributes:
    label: 截图 / 录屏
    description: 推荐拖入或粘贴实际截图。Agent 应附图；无法截图或不适用时，请具体说明原因和替代验证。
  validations:
    required: false
- type: textarea
  id: additional
  attributes:
    label: 补充说明
  validations:
    required: false
